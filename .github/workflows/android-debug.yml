name: Build Android Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build dependencies (gawk, cmake, ninja, unzip, wget)
        run: |
          sudo apt-get update
          sudo apt-get install -y gawk cmake ninja-build unzip wget

      - name: Set up Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Install Android SDK (cmdline-tools + packages)
        run: |
          set -e
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
          unzip -q cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export ANDROID_HOME="$SDK_ROOT"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK_ROOT/platform-tools" >> $GITHUB_PATH
          sdkmanager --version
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/28.2.13676358" >> $GITHUB_ENV

      # 固定签名 keystore（base64 存 secret；没有该 secret 时回退 debug 签名）
      - name: Restore signing keystore
        run: |
          if [ -n "${{ secrets.MINISFP_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.MINISFP_KEYSTORE_B64 }}" | base64 -d > $HOME/minisfp.keystore
            echo "keystore restored ($(wc -c < $HOME/minisfp.keystore) bytes)"
          else
            echo "no MINISFP_KEYSTORE_B64 secret; generating a throwaway one"
            keytool -genkeypair -v -keystore $HOME/minisfp.keystore -alias minisfp \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass minisfp123 -keypass minisfp123 \
              -dname "CN=Minis FP, O=MinisFP, C=CN"
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('src/android/**/*.gradle*', 'src/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Copy provider customization template
        run: |
          cp -n src/android/app/provider-customization.properties.example \
                src/android/app/provider-customization.properties || true

      - name: Build native dependency — proot
        run: ./deps/build_proot.sh

      - name: Prepare Alpine sandbox rootfs
        run: ./scripts/prepare_android_sandbox.sh

      - name: Build rclone aar
        run: |
          ./deps/build_rclone_android.sh
          mkdir -p src/android/app/libs
          cp deps/build/rclone/rclone.aar src/android/app/libs/

      - name: Build perf APK (pinned keystore, v1+v2, unminified)
        working-directory: src/android
        run: ./gradlew :app:assemblePerf --no-daemon --stacktrace

      - name: Verify signing schemes
        working-directory: src/android
        run: |
          APK=app/build/outputs/apk/perf/app-perf.apk
          ls -l "$APK"
          unzip -l "$APK" | grep -iE "META-INF/.*\.(RSA|SF|MF)" || echo "no v1 (META-INF) entries"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-perf-apk
          path: src/android/app/build/outputs/apk/perf/app-perf.apk
          retention-days: 90
          if-no-files-found: error
